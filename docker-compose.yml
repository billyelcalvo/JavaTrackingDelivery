# One command: `docker compose up --build`. Values come from .env (see .env.example).
services:
  db:
    image: ${POSTGIS_IMAGE:-imresamu/postgis:16-3.5}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracking}
      POSTGRES_USER: ${POSTGRES_USER:-tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracking}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tracking}
      DATABASE_USERNAME: ${POSTGRES_USER:-tracking}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-tracking}
      API_KEY: ${API_KEY:-local-dev-api-key}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}

volumes:
  pgdata:
