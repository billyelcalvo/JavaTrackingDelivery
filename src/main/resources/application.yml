server:
  # PORT is what PaaS like Render inject; SERVER_PORT wins if both are set
  port: ${SERVER_PORT:${PORT:8080}}
  shutdown: graceful

spring:
  application:
    name: tracking-delivery
  threads:
    virtual:
      enabled: true
  datasource:
    # Either a full JDBC URL, or the pieces (handy when the platform hands out host/port/db separately)
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:tracking}}
    username: ${DATABASE_USERNAME:tracking}
    password: ${DATABASE_PASSWORD:tracking}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 3000
      data-source-properties:
        # lets the driver collapse batched INSERTs into multi-row statements
        reWriteBatchedInserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  level:
    root: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

tracking:
  security:
    api-key: ${API_KEY}
    jwt-secret: ${JWT_SECRET}
    courier-token-ttl: ${COURIER_TOKEN_TTL:12h}
  ingestion:
    flush-interval: ${INGESTION_FLUSH_INTERVAL:500ms}
    history-queue-capacity: ${INGESTION_HISTORY_QUEUE_CAPACITY:200000}
    max-batch-size: ${INGESTION_MAX_BATCH_SIZE:5000}
    min-ping-interval: ${INGESTION_MIN_PING_INTERVAL:500ms}
  assignment:
    search-radius-meters: ${ASSIGNMENT_SEARCH_RADIUS_METERS:5000}
    location-freshness: ${ASSIGNMENT_LOCATION_FRESHNESS:60s}
    retry-interval: ${ASSIGNMENT_RETRY_INTERVAL:5s}
    retry-batch-size: ${ASSIGNMENT_RETRY_BATCH_SIZE:50}
  websocket:
    send-time-limit: ${WS_SEND_TIME_LIMIT:5s}
    send-buffer-size-limit: ${WS_SEND_BUFFER_LIMIT:65536}
    allowed-origins: ${WS_ALLOWED_ORIGINS:*}
